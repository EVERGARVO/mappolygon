<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>원인 파악용 자동 진단</title>
    <!-- YOUR_CLIENT_ID 부분만 수정하세요 -->
    <script type="text/javascript" src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=rcr72nudd5&submodules=drawing"></script>
</head>
<body>
    <div id="map" style="width:100%; height:800px;"></div>

    <script>
        var map = new naver.maps.Map('map', {
            center: new naver.maps.LatLng(36.8850, 127.1436),
            zoom: 14 
        });

        // 지도가 다 켜진 후 진단을 시작합니다.
        naver.maps.Event.once(map, 'init', function() {
            
            // 1. 네이버 지도 drawing 모듈이 다운로드 되었는지 검사
            if (typeof naver.maps.drawing === 'undefined') {
                alert("🚨 [에러 발견] 그리기 도구가 다운로드되지 않았습니다!\n\n가장 유력한 원인 2가지:\n1. Client ID 양옆에 따옴표('')를 넣었거나 띄어쓰기가 들어갔습니다.\n2. 메모장/에디터가 &submodules 부분을 &amp;submodules 로 멋대로 바꿔버렸습니다.");
            } 
            else {
                alert("✅ [정상] 그리기 도구가 완벽하게 로드되었습니다! 이제 화면에 그려집니다.");
                
                var drawingManager = new naver.maps.drawing.DrawingManager({
                    map: map,
                    drawingControl: [naver.maps.drawing.DrawingMode.POLYGON],
                    drawingControlOptions: { position: naver.maps.Position.TOP_LEFT }
                });
            }
        });
    </script>
</body>
</html>
