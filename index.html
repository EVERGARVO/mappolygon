<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>천안 직산 폴리곤 공유 지도</title>
    
    <!-- ⚠️ 주의: YOUR_CLIENT_ID 부분만 본인의 Client ID로 변경하세요 -->
    <script type="text/javascript" src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=rcr72nudd5&submodules=drawing"></script>
    
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 10px; }
        .btn { padding: 10px; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 5px; margin-bottom: 5px;}
        .btn-extract { background-color: #ff4c4c; } /* 빨강 */
        .btn-import { background-color: #4a90e2; }  /* 파랑 */
        .btn-reset { background-color: #6c757d; }   /* 회색 */
    </style>
</head>
<body>
    <div style="margin-bottom: 5px;">
        <button class="btn btn-extract" onclick="exportPolygon()">
            1. 내가 그린 구역 좌표 추출하기 (저장용)
        </button>
        <button class="btn btn-import" onclick="importPolygon()">
            2. 텍스트 창의 구역 지도에 불러오기 (공유용)
        </button>
        <button class="btn btn-reset" onclick="location.reload()">
            3. 지도 전체 지우기 (초기화)
        </button>
    </div>
    
    <textarea id="dataIO" placeholder="여기에 추출된 데이터가 나오거나, 공유받은 데이터를 붙여넣으세요." style="width:100%; height:80px; margin-bottom:10px; border:2px solid #ddd;"></textarea>

    <!-- 지도 영역 -->
    <div id="map" style="width:100%; height:700px; border:1px solid #ccc;"></div>

    <script>
        var map = new naver.maps.Map('map', {
            center: new naver.maps.LatLng(36.8850, 127.1436), // 직산역 인근
            zoom: 14 
        });

        var drawingManager = new naver.maps.drawing.DrawingManager({
            map: map,
            drawingControl: [
                naver.maps.drawing.DrawingMode.POLYGON 
            ],
            drawingControlOptions: {
                position: naver.maps.Position.TOP_LEFT
            },
            polygonOptions: { 
                fillColor: '#ff0000', 
                fillOpacity: 0.3, 
                strokeColor: '#ff0000',
                strokeWeight: 2
            }
        });

        // 추출 버튼 함수
        function exportPolygon() {
            var data = drawingManager.toGeoJson();
            var textData = JSON.stringify(data);
            
            if (textData === '{"type":"FeatureCollection","features":[]}') {
                alert("지도에 그려진 구역이 없습니다. 먼저 다각형을 그려주세요!");
                return;
            }
            
            document.getElementById('dataIO').value = textData;
            alert("좌표가 추출되었습니다. 아래 텍스트창의 내용을 복사해서 따로 저장해두세요!");
        }

        // 불러오기 버튼 함수
        function importPolygon() {
            var textData = document.getElementById('dataIO').value;
            if (!textData) {
                alert("불러올 데이터(텍스트)를 위에 붙여넣어 주세요.");
                return;
            }
            try {
                var geojson = JSON.parse(textData);
                map.data.addGeoJson(geojson);
                map.data.setStyle(function(feature) {
                    return {
                        fillColor: '#0055ff', 
                        fillOpacity: 0.3,
                        strokeColor: '#0055ff',
                        strokeWeight: 2
                    };
                });
                alert("구역을 성공적으로 불러왔습니다!");
            } catch (e) {
                alert("데이터 형식이 잘못되었습니다. 복사한 텍스트 전체를 제대로 붙여넣었는지 확인해주세요.");
            }
        }
    </script>
</body>
</html>
