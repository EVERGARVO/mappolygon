<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>그리기 도구 진단</title>
    <!-- 반드시 &submodules=drawing 이 붙어있어야 합니다 -->
    <script type="text/javascript" src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=rcr72nudd5&submodules=drawing"></script>
</head>
<body>
    <!-- 버튼들 다 빼고 지도만 전체 화면으로 띄웁니다 -->
    <div id="map" style="width:100%; height:800px;"></div>

    <script>
        var map = new naver.maps.Map('map', {
            center: new naver.maps.LatLng(36.8850, 127.1436), // 직산역
            zoom: 14 
        });

        // 어떠한 제약이나 위치 변경 없이 가장 순수한 상태로 그리기 도구를 호출합니다.
        // 이렇게 하면 지도 위쪽 가운데(TOP_CENTER)에 모든 그리기 아이콘이 나타나야 합니다.
        var drawingManager = new naver.maps.drawing.DrawingManager({
            map: map
        });
    </script>
</body>
</html>
